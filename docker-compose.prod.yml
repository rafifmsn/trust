x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  trust:
    container_name: trust
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SEED_DOMAINS_PATH=/app/seed/domains.json
      - REDIS_URL=redis://redis-store:6379
      - UMAMI_URL
      - UMAMI_WEBSITE_ID
      - ADMIN_API_KEY
    volumes:
      - ./seed:/app/seed:ro # Read-only mount in production
    networks:
      - internal-bridge
      - caddy_proxy
    <<: *default-logging

  redis-store:
    restart: unless-stopped
    <<: *default-logging

networks:
  caddy_proxy:
    external: true
